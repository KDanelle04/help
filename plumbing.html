<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Notes</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="notes.css" />
  </head>
  <body>
    <main class="phone" id="phone">
      <!-- Global toast -->
      <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
        <span id="toastText">Saved</span>

        <button
          class="toast-close"
          type="button"
          data-command="close-toast"
          aria-label="Close message"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Notes list view -->
      <section class="app view active" id="notesView">
        <header class="topbar">
          <div class="title-stack">
            <h1>Notes</h1>
          </div>

          <div class="top-actions">
            <button
              class="icon-btn"
              type="button"
              data-command="toggle-note-tools"
              aria-label="Show note tools"
            >
              <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
            </button>

            <button
              class="icon-btn primary"
              type="button"
              data-command="new-note"
              aria-label="Create new note"
            >
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
            </button>
          </div>
        </header>

        <label class="search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input
            id="searchInput"
            type="search"
            placeholder="Search notes"
            autocomplete="off"
          />
        </label>

        <div class="note-list" id="noteList"></div>
      </section>

      <!-- Note editor view -->
      <section class="app view" id="editorView">
        <header class="topbar center">
          <button
            class="icon-btn"
            type="button"
            data-command="back"
            aria-label="Back to notes"
          >
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
          </button>

          <div class="title-stack">
            <p class="kicker" id="editorModeLabel">
              <i class="fa-solid fa-pen" aria-hidden="true"></i>
              <span id="editorModeText">Editing</span>
            </p>
          </div>

          <div class="top-actions">
            <button
              class="icon-btn"
              type="button"
              data-command="toggle-block-selection-mode"
              aria-label="Selection mode"
            >
              <i class="fa-solid fa-pen" aria-hidden="true"></i>
            </button>

            <button
              class="icon-btn"
              type="button"
              data-command="undo-action"
              aria-label="Undo"
            >
              <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
            </button>

            <button
              class="icon-btn"
              type="button"
              data-command="redo-action"
              aria-label="Redo"
            >
              <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            </button>
          </div>
        </header>

        <textarea
          class="editor-title"
          id="titleInput"
          rows="1"
          placeholder="Untitled note"
        ></textarea>
        <div class="blocks" id="blocks"></div>
      </section>

      <!-- Global editor toolbar -->
      <nav
        class="toolbar"
        id="toolbar"
        aria-label="Formatting and insert toolbar"
      >
        <button type="button" data-command="format-bold" aria-label="Bold">
          <i class="fa-solid fa-bold" aria-hidden="true"></i>
        </button>
        <button type="button" data-command="format-italic" aria-label="Italic">
          <i class="fa-solid fa-italic" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-command="format-underline"
          aria-label="Underline"
        >
          <i class="fa-solid fa-underline" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-command="format-highlight"
          aria-label="Highlight"
        >
          <i class="fa-solid fa-highlighter" aria-hidden="true"></i>
        </button>
        <button
          class="enter-child-tool"
          type="button"
          data-command="enter-child-note"
          aria-label="Enter child note"
        >
          <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-command="open-size-menu"
          aria-label="Text size"
        >
          <strong aria-hidden="true">aA</strong>
        </button>
        <button
          type="button"
          data-command="open-text-color-menu"
          aria-label="Text color"
        >
          <i class="fa-solid fa-palette" aria-hidden="true"></i>
        </button>
        <button type="button" data-command="add-bullet" aria-label="Add bullet">
          <i class="fa-solid fa-list-ul" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-command="add-number"
          aria-label="Add numbered item"
        >
          <i class="fa-solid fa-list-ol" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-command="add-task"
          aria-label="Add checklist"
        >
          <i class="fa-solid fa-square-check" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-command="add-heading"
          aria-label="Toggle dropdown"
        >
          <i class="fa-solid fa-caret-down" aria-hidden="true"></i>
        </button>
        <button type="button" data-command="photo" aria-label="Add photo">
          <i class="fa-solid fa-image" aria-hidden="true"></i>
        </button>
        <button
          class="alignment-tool"
          type="button"
          data-command="cycle-alignment"
          aria-label="Text alignment"
        >
          <i class="fa-solid fa-align-left" aria-hidden="true"></i>
        </button>
        <button
          class="primary"
          type="button"
          data-command="add-text"
          aria-label="Add text"
        >
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
        </button>
      </nav>

      <!-- Selection actions -->
      <div class="selection-bar" id="selectionBar">
        <div class="selection-text">
          <strong id="selectionTitle">1 selected</strong>
          <span>Drag selected blocks to reorder.</span>
        </div>
        <div class="selection-actions">
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="format-bold"
            aria-label="Bold"
          >
            <i class="fa-solid fa-bold" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="format-italic"
            aria-label="Italic"
          >
            <i class="fa-solid fa-italic" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="format-underline"
            aria-label="Underline"
          >
            <i class="fa-solid fa-underline" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="format-highlight"
            aria-label="Highlight"
          >
            <i class="fa-solid fa-highlighter" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool enter-child-tool"
            type="button"
            data-command="enter-child-note"
            aria-label="Enter child note"
          >
            <i
              class="fa-solid fa-arrow-right-to-bracket"
              aria-hidden="true"
            ></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="add-bullet"
            aria-label="Make bullet list"
          >
            <i class="fa-solid fa-list-ul" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="add-number"
            aria-label="Make numbered list"
          >
            <i class="fa-solid fa-list-ol" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="add-task"
            aria-label="Make checklist"
          >
            <i class="fa-solid fa-square-check" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="add-heading"
            aria-label="Toggle dropdown"
          >
            <i class="fa-solid fa-caret-down" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="open-text-color-menu"
            aria-label="Text color"
          >
            <i class="fa-solid fa-palette" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="group-selected"
            aria-label="Group"
          >
            <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="cut-selected"
            aria-label="Cut"
          >
            <i class="fa-solid fa-scissors" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="copy-selected"
            aria-label="Copy"
          >
            <i class="fa-solid fa-copy" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="paste-blocks"
            aria-label="Paste"
          >
            <i class="fa-solid fa-paste" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="open-size-menu"
            aria-label="Text size"
          >
            <strong aria-hidden="true">aA</strong>
          </button>
          <button
            class="icon-btn block-tool"
            type="button"
            data-command="open-view-text"
            aria-label="View text"
          >
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn block-tool alignment-tool"
            type="button"
            data-command="cycle-alignment"
            aria-label="Text alignment"
          >
            <i class="fa-solid fa-align-left" aria-hidden="true"></i>
          </button>
          <button
            class="icon-btn note-tool"
            type="button"
            data-command="pin-selected-note"
            aria-label="Pin note"
          >
            <i class="fa-solid fa-thumbtack" aria-hidden="true"></i>
          </button>

          <button
            class="icon-btn note-tool"
            type="button"
            data-command="move-selected-note-up"
            aria-label="Move note up"
          >
            <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
          </button>

          <button
            class="icon-btn note-tool"
            type="button"
            data-command="move-selected-note-down"
            aria-label="Move note down"
          >
            <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
          </button>

          <button
            class="icon-btn note-tool"
            type="button"
            data-command="edit-selected-note"
            aria-label="Edit note"
          >
            <i class="fa-solid fa-pen" aria-hidden="true"></i>
          </button>

          <button
            class="icon-btn danger note-tool"
            type="button"
            data-command="delete-selected-note"
            aria-label="Delete note"
          >
            <i class="fa-solid fa-trash" aria-hidden="true"></i>
          </button>

          <button
            class="icon-btn danger block-tool"
            type="button"
            data-command="delete-selected"
            aria-label="Delete"
          >
            <i class="fa-solid fa-trash" aria-hidden="true"></i>
          </button>

          <button
            class="icon-btn"
            type="button"
            data-command="done-selection"
            aria-label="Done"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Primary navigation -->
      <nav class="nav" aria-label="Primary navigation">
        <button class="nav-item" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M3 10.7 12 3l9 7.7V20a1 1 0 0 1-1 1h-5.2v-6.6H9.2V21H4a1 1 0 0 1-1-1v-9.3Z"
            />
          </svg>
          Home
        </button>
        <button class="nav-item" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="currentColor" />
            <circle cx="12" cy="12" r="3" stroke="currentColor" />
          </svg>
          Habit
        </button>
        <button class="add" type="button" aria-label="Add task">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 5v14M5 12h14"
              stroke="currentColor"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button class="nav-item active" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M6 3h8l4 4v14H6V3Z"
              stroke="currentColor"
              stroke-linejoin="round"
            />
            <path
              d="M14 3v5h5M9 13h6M9 17h4"
              stroke="currentColor"
              stroke-linecap="round"
            />
          </svg>
          Notes
        </button>
        <button class="nav-item" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="4" stroke="currentColor" />
            <path
              d="M4 21a8 8 0 0 1 16 0"
              stroke="currentColor"
              stroke-linecap="round"
            />
          </svg>
          Profile
        </button>
      </nav>

      <!-- Dialogs and pickers -->
      <div class="modal" id="noteModal" aria-hidden="true">
        <section
          class="sheet compact-sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="noteModalTitle"
        >
          <div class="grabber"></div>
          <div class="sheet-head">
            <h2 id="noteModalTitle">New note</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-note-modal"
              aria-label="Cancel"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="note-form">
            <label class="field">
              <span>Title</span>
              <input
                id="noteTitleField"
                type="text"
                placeholder="Title"
                autocomplete="off"
              />
            </label>

            <div>
              <p class="kicker">
                <i class="fa-solid fa-palette" aria-hidden="true"></i> Color
              </p>
              <div class="color-row" id="colorChoices"></div>
            </div>

            <div>
              <p class="kicker">
                <i class="fa-solid fa-icons" aria-hidden="true"></i> Icon
              </p>
              <div class="icon-row" id="iconChoices"></div>
            </div>

            <div>
              <p class="kicker">
                <i
                  class="fa-solid fa-circle-half-stroke"
                  aria-hidden="true"
                ></i>
                Page mode
              </p>
              <div class="mode-row" id="pageModeChoices">
                <button
                  class="mode-choice"
                  type="button"
                  data-command="draft-page-mode"
                  data-mode="dark"
                >
                  Dark
                </button>
                <button
                  class="mode-choice"
                  type="button"
                  data-command="draft-page-mode"
                  data-mode="light"
                >
                  Light
                </button>
              </div>
            </div>

            <div class="modal-actions">
              <button
                class="modal-action"
                id="noteModalSecondaryButton"
                type="button"
                data-command="note-modal-secondary"
              >
                Cancel
              </button>
              <button
                class="modal-action primary"
                id="noteModalSaveButton"
                type="button"
                data-command="save-note-modal"
              >
                Add
              </button>
            </div>
          </div>
        </section>
      </div>

      <!-- Insert block menus -->
      <div class="modal" id="insertModal" aria-hidden="true">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="insertTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="insertTitle">Add</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-insert"
              aria-label="Close add menu"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="insert-list">
            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="paragraph"
            >
              <i class="fa-solid fa-align-left" aria-hidden="true"></i
              ><span>Text Box</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="open-card-options"
            >
              <i class="fa-solid fa-note-sticky" aria-hidden="true"></i
              ><span>Card</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="open-line-options"
            >
              <i class="fa-solid fa-grip-lines" aria-hidden="true"></i
              ><span>Line</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="heading"
            >
              <i class="fa-solid fa-heading" aria-hidden="true"></i
              ><span>Heading</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="number"
            >
              <i class="fa-solid fa-list-ol" aria-hidden="true"></i
              ><span>Number</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="bullet"
            >
              <i class="fa-solid fa-list-ul" aria-hidden="true"></i
              ><span>Bullet</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="task"
            >
              <i class="fa-solid fa-square-check" aria-hidden="true"></i
              ><span>Checkbox</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="image"
            >
              <i class="fa-solid fa-image" aria-hidden="true"></i
              ><span>Image</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="url"
            >
              <i class="fa-solid fa-link" aria-hidden="true"></i
              ><span>URL</span>
            </button>
          </div>
        </section>
      </div>

      <div class="modal" id="lineModal" aria-hidden="true">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="lineTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="lineTitle">Line type</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-line-options"
              aria-label="Close line options"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="insert-list">
            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="separator-dotted"
            >
              <i class="fa-solid fa-ellipsis" aria-hidden="true"></i
              ><span>Dotted</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="separator-thin"
            >
              <i class="fa-solid fa-minus" aria-hidden="true"></i
              ><span>Thin</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="separator-normal"
            >
              <i class="fa-solid fa-grip-lines" aria-hidden="true"></i
              ><span>Normal</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="separator-strong"
            >
              <i class="fa-solid fa-grip-lines-vertical" aria-hidden="true"></i
              ><span>Strong</span>
            </button>
          </div>
        </section>
      </div>

      <div class="modal" id="cardModal" aria-hidden="true">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="cardTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="cardTitle">Card type</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-card-options"
              aria-label="Close card options"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="insert-list">
            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="card-square"
            >
              <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i
              ><span>Square Card</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="insert-block"
              data-type="card-horizontal"
            >
              <i class="fa-solid fa-rectangle-list" aria-hidden="true"></i
              ><span>Horizontal Card</span>
            </button>
          </div>
        </section>
      </div>

      <div class="modal" id="cardCoverModal" aria-hidden="true">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="cardCoverTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="cardCoverTitle">Card includes</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-card-cover-options"
              aria-label="Close card cover options"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="insert-list">
            <button
              class="insert-option"
              type="button"
              data-command="set-card-cover"
              data-cover="title-text"
            >
              <i class="fa-solid fa-align-left" aria-hidden="true"></i
              ><span>Title + Text</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="set-card-cover"
              data-cover="title-image"
            >
              <i class="fa-solid fa-image" aria-hidden="true"></i
              ><span>Title + Image</span>
            </button>

            <button
              class="insert-option"
              type="button"
              data-command="set-card-cover"
              data-cover="title-icon"
            >
              <i class="fa-solid fa-icons" aria-hidden="true"></i
              ><span>Title + Icon</span>
            </button>
          </div>
        </section>
      </div>

      <div class="modal" id="blockEditModal" aria-hidden="true">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="blockEditTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="blockEditTitle">Block edit</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-block-edit-menu"
              aria-label="Close block edit"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="insert-list" id="blockEditChoices"></div>
        </section>
      </div>

      <!-- Formatting pickers -->
      <div class="modal" id="sizeModal" aria-hidden="true">
        <section
          class="sheet compact-sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="sizeTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="sizeTitle">Text size</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-size-menu"
              aria-label="Close text size"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="size-list">
            <button
              class="size-option"
              type="button"
              data-command="set-block-size"
              data-size="title"
            >
              Title <span>Largest</span>
            </button>
            <button
              class="size-option"
              type="button"
              data-command="set-block-size"
              data-size="heading"
            >
              Heading <span>Section</span>
            </button>
            <button
              class="size-option"
              type="button"
              data-command="set-block-size"
              data-size="subtitle"
            >
              Subtitle <span>Medium</span>
            </button>
            <button
              class="size-option"
              type="button"
              data-command="set-block-size"
              data-size="text"
            >
              Text <span>Normal</span>
            </button>
            <button
              class="size-option"
              type="button"
              data-command="set-block-size"
              data-size="subtext"
            >
              Subtext <span>Small</span>
            </button>
          </div>
        </section>
      </div>

      <div class="modal" id="blockColorModal" aria-hidden="true">
        <section
          class="sheet compact-sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="blockColorTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="blockColorTitle">Icon color</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-block-color-menu"
              aria-label="Close icon color"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="preset-grid" id="blockColorChoices"></div>
        </section>
      </div>

      <div class="modal" id="blockIconModal" aria-hidden="true">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="blockIconTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="blockIconTitle">Icon</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-block-icon-menu"
              aria-label="Close icon"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div
            class="icon-row categorized-icon-picker"
            id="blockIconChoices"
          ></div>
        </section>
      </div>

      <div class="modal" id="textColorModal" aria-hidden="true">
        <section
          class="sheet compact-sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="textColorTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="textColorTitle">Text color</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-text-color-menu"
              aria-label="Close text color"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="preset-grid" id="textColorChoices"></div>
        </section>
      </div>

      <div class="modal" id="viewTextModal" aria-hidden="true">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="viewTextTitle"
        >
          <div class="grabber"></div>

          <div class="sheet-head">
            <h2 id="viewTextTitle">View text</h2>
            <button
              class="icon-btn"
              type="button"
              data-command="close-view-text"
              aria-label="Close view text"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <textarea
            class="view-field"
            id="viewTextField"
            spellcheck="true"
          ></textarea>

          <div class="modal-actions">
            <button
              class="modal-action"
              type="button"
              data-command="close-view-text"
            >
              Cancel
            </button>
            <button
              class="modal-action primary"
              type="button"
              data-command="save-view-text"
            >
              Save
            </button>
          </div>
        </section>
      </div>

      <!-- Media viewer -->
      <div class="image-viewer" id="imageViewer" aria-hidden="true">
        <img id="imageViewerImg" alt="Full note image" />
        <button
          class="icon-btn image-close"
          type="button"
          data-command="close-image"
          aria-label="Close image"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </main>

    <input id="photoInput" type="file" accept="image/*" multiple hidden />

    <script src="notes.js"></script>

    <script>
      const APP_VERSION = "2";
      const oldVersion = localStorage.getItem("appVersion");

      if (oldVersion && oldVersion !== APP_VERSION) {
        localStorage.setItem("appVersion", APP_VERSION);
        location.reload();
      } else {
        localStorage.setItem("appVersion", APP_VERSION);
      }
    </script>
    <script src="bottom-bar.js"></script>
  </body>
</html>
